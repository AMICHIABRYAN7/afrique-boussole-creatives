<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Fond Blanc -->
  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- Cercles Concentriques & Graduations Cartographiques -->
  <circle cx="500" cy="500" r="440" fill="none" stroke="#013C87" stroke-width="6"/>
  <circle cx="500" cy="500" r="420" fill="none" stroke="#013C87" stroke-width="2"/>
  <circle cx="500" cy="500" r="340" fill="none" stroke="#1D7742" stroke-width="3" stroke-dasharray="4 8"/>
  <circle cx="500" cy="500" r="320" fill="none" stroke="#013C87" stroke-width="2"/>

  <!-- Graduations (Ticks 15° et 5°) -->
  <g stroke="#013C87" stroke-linecap="round" opacity="0.85">
    <!-- Repères principaux 30° -->
    <line x1="500" y1="65" x2="500" y2="80" stroke-width="4"/>
    <line x1="717" y1="123" x2="710" y2="136" stroke-width="3"/>
    <line x1="877" y1="283" x2="864" y2="290" stroke-width="3"/>
    <line x1="935" y1="500" x2="920" y2="500" stroke-width="4"/>
    <line x1="877" y1="717" x2="864" y2="710" stroke-width="3"/>
    <line x1="717" y1="877" x2="710" y2="864" stroke-width="3"/>
    <line x1="500" y1="935" x2="500" y2="920" stroke-width="4"/>
    <line x1="283" y1="877" x2="290" y2="864" stroke-width="3"/>
    <line x1="123" y1="717" x2="136" y2="710" stroke-width="3"/>
    <line x1="65" y1="500" x2="80" y2="500" stroke-width="4"/>
    <line x1="123" y1="283" x2="136" y2="290" stroke-width="3"/>
    <line x1="283" y1="123" x2="290" y2="136" stroke-width="3"/>
  </g>

  <!-- Marquages des Degrés -->
  <text x="500" y="105" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#013C87" text-anchor="middle">0°</text>
  <text x="895" y="506" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#013C87" text-anchor="middle">90°</text>
  <text x="500" y="910" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#013C87" text-anchor="middle">180°</text>
  <text x="105" y="506" font-family="-apple-system, sans-serif" font-size="20" font-weight="600" fill="#013C87" text-anchor="middle">270°</text>

  <!-- Points Cardinaux (N, S, E, W) -->
  <text x="500" y="145" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#013C87" text-anchor="middle" dominant-baseline="middle">N</text>
  <text x="500" y="855" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#013C87" text-anchor="middle" dominant-baseline="middle">S</text>
  <text x="855" y="500" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#013C87" text-anchor="middle" dominant-baseline="middle">E</text>
  <text x="145" y="500" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" fill="#013C87" text-anchor="middle" dominant-baseline="middle">W</text>

  <!-- Points Intercardinaux (NE, SE, SW, NW) -->
  <text x="735" y="265" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#1D7742" text-anchor="middle" dominant-baseline="middle">NE</text>
  <text x="735" y="735" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#1D7742" text-anchor="middle" dominant-baseline="middle">SE</text>
  <text x="265" y="735" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#1D7742" text-anchor="middle" dominant-baseline="middle">SW</text>
  <text x="265" y="265" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#1D7742" text-anchor="middle" dominant-baseline="middle">NW</text>

  <!-- Étoile Intercardinale (4 Branches Vertes - Vert #1D7742) -->
  <g fill="#1D7742" opacity="0.9" stroke="#ffffff" stroke-width="2">
    <!-- Nord-Est -->
    <polygon points="500,500 520,440 680,320 560,480"/>
    <!-- Sud-Est -->
    <polygon points="500,500 560,520 680,680 520,560"/>
    <!-- Sud-Ouest -->
    <polygon points="500,500 480,560 320,680 440,520"/>
    <!-- Nord-Ouest -->
    <polygon points="500,500 440,480 320,320 480,440"/>
  </g>

  <!-- Rose des Vents Principale (4 Branches Bleu Marine #013C87) -->
  <g stroke="#ffffff" stroke-width="2" stroke-linejoin="round">
    <!-- Nord -->
    <polygon points="500,180 530,470 500,450" fill="#013C87"/>
    <polygon points="500,180 500,450 470,470" fill="#013C87" opacity="0.75"/>
    <!-- Sud -->
    <polygon points="500,820 470,530 500,550" fill="#013C87"/>
    <polygon points="500,820 500,550 530,530" fill="#013C87" opacity="0.75"/>
    <!-- Est -->
    <polygon points="820,500 530,530 550,500" fill="#013C87"/>
    <polygon points="820,500 550,500 530,470" fill="#013C87" opacity="0.75"/>
    <!-- Ouest -->
    <polygon points="180,500 470,470 450,500" fill="#013C87"/>
    <polygon points="180,500 450,500 470,530" fill="#013C87" opacity="0.75"/>
  </g>

  <!-- Cadran Central -->
  <circle cx="500" cy="500" r="30" fill="#ffffff" stroke="#013C87" stroke-width="4"/>
  <circle cx="500" cy="500" r="16" fill="#1D7742"/>
  <circle cx="500" cy="500" r="6" fill="#ffffff"/>
</svg>
