<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Lignes Principales Intersectantes -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#013C87" stroke-width="2"/>
  <line x1="400" y1="100" x2="400" y2="700" stroke="#013C87" stroke-width="2"/>

  <!-- Cercles Concentriques de Précision -->
  <circle cx="400" cy="400" r="180" fill="none" stroke="#013C87" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="400" cy="400" r="80" fill="none" stroke="#013C87" stroke-width="1"/>
  <circle cx="400" cy="400" r="4" fill="#013C87"/>

  <!-- Graduations (Ticks) Horizontales -->
  <g stroke="#013C87" stroke-width="1.5">
    <line x1="150" y1="392" x2="150" y2="408"/>
    <line x1="200" y1="395" x2="200" y2="405"/>
    <line x1="250" y1="392" x2="250" y2="408"/>
    <line x1="300" y1="390" x2="300" y2="410"/>
    <line x1="350" y1="395" x2="350" y2="405"/>
    <line x1="450" y1="395" x2="450" y2="405"/>
    <line x1="500" y1="390" x2="500" y2="410"/>
    <line x1="550" y1="392" x2="550" y2="408"/>
    <line x1="600" y1="395" x2="600" y2="405"/>
    <line x1="650" y1="392" x2="650" y2="408"/>
  </g>

  <!-- Graduations (Ticks) Verticales -->
  <g stroke="#013C87" stroke-width="1.5">
    <line x1="392" y1="150" x2="408" y2="150"/>
    <line x1="395" y1="200" x2="405" y2="200"/>
    <line x1="392" y1="250" x2="408" y2="250"/>
    <line x1="390" y1="300" x2="410" y2="300"/>
    <line x1="395" y1="350" x2="405" y2="350"/>
    <line x1="395" y1="450" x2="405" y2="450"/>
    <line x1="390" y1="500" x2="410" y2="500"/>
    <line x1="392" y1="550" x2="408" y2="550"/>
    <line x1="395" y1="600" x2="405" y2="600"/>
    <line x1="392" y1="650" x2="408" y2="650"/>
  </g>
</svg>
