<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrique Boussole — Contact Sheets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #013C87;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 0.95em;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-title {
            font-weight: 600;
            color: #013C87;
            margin-bottom: 5px;
        }
        .card-meta {
            font-size: 0.85em;
            color: #999;
        }
        .footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #999;
            font-size: 0.9em;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Afrique Boussole Contact Sheets</h1>
        <p class="subtitle">Quick visual reference library for design assets</p>
        
        <div class="gallery">

            <a href="contact-sheet-flyers.jpg" class="card">
                <img src="contact-sheet-flyers.jpg" alt="Flyers">
                <div class="card-content">
                    <div class="card-title">Flyers</div>
                    <div class="card-meta">11 images</div>
                </div>
            </a>

            <a href="contact-sheet-posters.jpg" class="card">
                <img src="contact-sheet-posters.jpg" alt="Posters">
                <div class="card-content">
                    <div class="card-title">Posters</div>
                    <div class="card-meta">6 images</div>
                </div>
            </a>

            <a href="contact-sheet-social.jpg" class="card">
                <img src="contact-sheet-social.jpg" alt="Social">
                <div class="card-content">
                    <div class="card-title">Social</div>
                    <div class="card-meta">4 images</div>
                </div>
            </a>

        </div>
        
        <div class="footer">
            <p>Generated on 2026-09-29 14:28:59</p>
            <p>Afrique Boussole Creative Intelligence Skill</p>
        </div>
    </div>
</body>
</html>
