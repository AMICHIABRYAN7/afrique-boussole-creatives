<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <g stroke="#013C87" fill="none">
    <!-- Cercles Concentriques de Limite -->
    <circle cx="400" cy="400" r="350" stroke-width="3"/>
    <circle cx="400" cy="400" r="320" stroke-width="1.5"/>

    <!-- Ticks Principaux Tous les 30 Degrés -->
    <g stroke-width="2">
      <line x1="400" y1="50" x2="400" y2="80"/>
      <line x1="575" y1="97" x2="560" y2="123"/>
      <line x1="703" y1="225" x2="677" y2="240"/>
      <line x1="750" y1="400" x2="720" y2="400"/>
      <line x1="703" y1="575" x2="677" y2="560"/>
      <line x1="575" y1="703" x2="560" y2="677"/>
      <line x1="400" y1="750" x2="400" y2="720"/>
      <line x1="225" y1="703" x2="240" y2="677"/>
      <line x1="97" y1="575" x2="123" y2="560"/>
      <line x1="50" y1="400" x2="80" y2="400"/>
      <line x1="97" y1="225" x2="123" y2="240"/>
      <line x1="225" y1="97" x2="240" y2="123"/>
    </g>
  </g>

  <!-- Inscriptions des Degrés -->
  <g font-family="monospace" font-size="18" font-weight="700" fill="#013C87" text-anchor="middle" dominant-baseline="central">
    <text x="400" y="105">0°</text>
    <text x="695" y="400">90°</text>
    <text x="400" y="695">180°</text>
    <text x="105" y="400">270°</text>
  </g>
</svg>
