<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" width="1500" height="700">
  <!-- Trajectoire de Route -->
  <path d="M 100,500 
           C 400,500 450,180 750,220 
           C 1050,260 1150,550 1400,200" 
        fill="none" 
        stroke="#013C87" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Jalons / Waypoints Numérotés (1-5) -->
  <g font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <!-- Étape 1 -->
    <circle cx="100" cy="500" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="3"/>
    <text x="100" y="500">1</text>

    <!-- Étape 2 -->
    <circle cx="430" cy="320" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="3"/>
    <text x="430" y="320">2</text>

    <!-- Étape 3 -->
    <circle cx="750" cy="220" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="3"/>
    <text x="750" y="220">3</text>

    <!-- Étape 4 -->
    <circle cx="1080" cy="380" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="3"/>
    <text x="1080" y="380">4</text>

    <!-- Étape 5 -->
    <circle cx="1400" cy="200" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="3"/>
    <text x="1400" y="200">5</text>
  </g>
</svg>
