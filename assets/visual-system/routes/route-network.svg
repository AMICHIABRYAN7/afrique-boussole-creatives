<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!-- Fond Blanc -->
  <rect width="1200" height="1200" fill="#ffffff"/>

  <!-- Lignes de Connexions du Réseau -->
  <g stroke-width="3" stroke-linecap="round">
    <!-- Liaisons Principales depuis le Hub Central -->
    <line x1="600" y1="600" x2="600" y2="250" stroke="#013C87"/>
    <line x1="600" y1="600" x2="950" y2="450" stroke="#013C87"/>
    <line x1="600" y1="600" x2="850" y2="850" stroke="#1D7742"/>
    <line x1="600" y1="600" x2="350" y2="850" stroke="#013C87"/>
    <line x1="600" y1="600" x2="250" y2="450" stroke="#1D7742"/>

    <!-- Liaisons Secondaires Périphériques (Pointillés) -->
    <line x1="600" y1="250" x2="950" y2="450" stroke="#1D7742" stroke-dasharray="6 6"/>
    <line x1="950" y1="450" x2="850" y2="850" stroke="#013C87" stroke-dasharray="6 6"/>
    <line x1="350" y1="850" x2="250" y2="450" stroke="#013C87" stroke-dasharray="6 6"/>
    <line x1="250" y1="450" x2="600" y2="250" stroke="#1D7742" stroke-dasharray="6 6"/>
  </g>

  <!-- Nœuds (Circuits/Stations) -->
  <!-- Hub Central -->
  <circle cx="600" cy="600" r="28" fill="#013C87"/>
  <circle cx="600" cy="600" r="14" fill="#ffffff"/>

  <!-- Nœuds Extérieurs (1 à 5) -->
  <circle cx="600" cy="250" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="4"/>
  <circle cx="950" cy="450" r="20" fill="#013C87" stroke="#ffffff" stroke-width="4"/>
  <circle cx="850" cy="850" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="4"/>
  <circle cx="350" cy="850" r="20" fill="#013C87" stroke="#ffffff" stroke-width="4"/>
  <circle cx="250" cy="450" r="20" fill="#1D7742" stroke="#ffffff" stroke-width="4"/>
</svg>
