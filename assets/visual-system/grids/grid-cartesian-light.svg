<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000">
  <defs>
    <!-- Motif de répétition de la grille cartésienne 100x100px (20x20 carrés) -->
    <pattern id="cartesianGridLight" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#E5EDF5" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Surface Maillée -->
  <rect width="2000" height="2000" fill="url(#cartesianGridLight)"/>
</svg>
