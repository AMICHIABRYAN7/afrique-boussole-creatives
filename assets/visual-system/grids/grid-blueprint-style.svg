<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000">
  <!-- Fond Bleu Marine Corporate Blueprint -->
  <rect width="2000" height="2000" fill="#013C87"/>

  <defs>
    <!-- Trame mineure 20px -->
    <pattern id="blueprintMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#70C0E8" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
    <!-- Trame majeure 100px -->
    <pattern id="blueprintMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#blueprintMinor)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#A0E0FF" stroke-width="1.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Application de la grille -->
  <rect width="2000" height="2000" fill="url(#blueprintMajor)"/>
</svg>
