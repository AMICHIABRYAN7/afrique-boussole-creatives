<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <pattern id="patternTriangles" width="100" height="173.205" patternUnits="userSpaceOnUse">
      <!-- Triangles Bleu Marine -->
      <polygon points="0,0 50,86.602 0,86.602" fill="#013C87" fill-opacity="0.12"/>
      <polygon points="50,86.602 100,173.205 50,173.205" fill="#013C87" fill-opacity="0.12"/>
      
      <!-- Triangles Verts -->
      <polygon points="50,0 100,0 50,86.602" fill="#1D7742" fill-opacity="0.12"/>
      <polygon points="0,86.602 50,173.205 0,173.205" fill="#1D7742" fill-opacity="0.12"/>

      <!-- Lignes de contours légères -->
      <path d="M 0,0 L 100,173.205 M 100,0 L 0,173.205 M 0,86.602 L 100,86.602" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="url(#patternTriangles)"/>
</svg>
